<html lang="zh-CN">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        :root {
            --dynamic-font-size: 12cqw;
            --bg-color: #05050f;
            --bg-secondary: #0a0a1a;
            --card-bg: rgba(10,10,25,0.7);
            --primary-color: #ff44cc;
            --primary-hover: #ff77dd;
            --secondary-color: #00f2ff;
            --text-main: #ffffff;
            --text-light: #eef5ff;
            --text-muted: #b0c4ff;
            --card-radius: 32px;
            --btn-radius: 40px;
            --card-shadow: 0 0 12px rgba(255,68,204,0.3);
            --card-shadow-active: 0 0 28px var(--primary-color), inset 0 0 12px var(--secondary-color);
            --neon-glow-primary: 0 0 8px var(--primary-color),0 0 18px var(--primary-color);
            --neon-glow-secondary: 0 0 8px var(--secondary-color),0 0 18px var(--secondary-color);
            --btn-bg: rgba(255,255,255,0.08);
            --btn-border: rgba(255,255,255,0.25);
            --header-bg: rgba(5,5,15,0.65);
            --volume-bg: #2a2a3a;
            --select-text: white;
            --select-bg: rgba(0,0,0,0.5);
            --select-option-bg: #1e1e2e;
            --card-text: #fff;
        }
        [data-theme="simple-light"] {
            --bg-color: #f5f7fc;
            --bg-secondary: #e9ecf2;
            --card-bg: rgba(255,255,255,0.85);
            --primary-color: #3b82f6;
            --primary-hover: #2563eb;
            --secondary-color: #10b981;
            --text-main: #1e293b;
            --text-light: #334155;
            --text-muted: #64748b;
            --card-shadow: 0 0 10px rgba(0,0,0,0.05);
            --card-shadow-active: 0 0 20px rgba(59,130,246,0.3), inset 0 0 5px rgba(16,185,129,0.2);
            --neon-glow-primary: 0 0 4px #3b82f6;
            --neon-glow-secondary: 0 0 4px #10b981;
            --btn-bg: rgba(0,0,0,0.05);
            --btn-border: rgba(0,0,0,0.15);
            --header-bg: rgba(255,255,255,0.7);
            --volume-bg: #cbd5e1;
            --select-text: #1e293b;
            --select-bg: rgba(255,255,255,0.85);
            --select-option-bg: white;
            --card-text: #1e293b;
        }
        [data-theme="violet"] { --primary-color: #b026ff; --secondary-color: #00e5ff; }
        [data-theme="forest"] { --primary-color: #00ff88; --secondary-color: #ff44ff; }
        [data-theme="ocean"] { --primary-color: #1e88e5; --secondary-color: #ffb74d; }
        [data-theme="sunset"] { --primary-color: #ff884d; --secondary-color: #ffee66; }
        [data-theme="pink"] { --primary-color: #ff66b5; --secondary-color: #66ffea; }
        body {
            background-color: var(--bg-color);
            font-family: 'Nunito', system-ui, sans-serif;
            min-height: 100vh;
            overflow: hidden;
            color: var(--text-light);
            transition: background 0.2s;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse at 20% 30%, rgba(255,68,204,0.2) 0%, transparent 50%),
                        radial-gradient(ellipse at 80% 70%, rgba(0,242,255,0.2) 0%, transparent 50%);
            z-index: -2;
            pointer-events: none;
        }
        .app-container { width: 100vw; height: 100vh; display: flex; flex-direction: column; padding: 1.5vh 2vw; position: relative; z-index: 1; }
        .top-bar { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 1.5vh; padding: 10px 20px; background: var(--header-bg); backdrop-filter: blur(12px); border-radius: 60px; border: 1px solid rgba(255,68,204,0.5); box-shadow: 0 4px 18px rgba(0,0,0,0.1); }
        .logo { font-size: 1.4rem; font-weight: 900; background: linear-gradient(135deg, #fff, var(--secondary-color)); -webkit-background-clip: text; background-clip: text; color: transparent; letter-spacing: 1px; }
        .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
        .btn { background: var(--btn-bg); border: 1px solid var(--btn-border); padding: 8px 16px; border-radius: 40px; color: var(--text-light); font-weight: 700; cursor: pointer; transition: 0.2s; backdrop-filter: blur(4px); font-size: 0.85rem; font-family: inherit; }
        .btn-primary { background: var(--primary-color); border-color: var(--primary-color); color: white; box-shadow: 0 0 10px var(--primary-color); }
        .btn-primary:hover { background: var(--primary-hover); transform: translateY(-2px); box-shadow: 0 0 20px var(--primary-color);}
        .btn:hover { background: rgba(255,255,255,0.2); transform: translateY(-1px); }
        .select-group { display: flex; gap: 6px; background: var(--select-bg); padding: 4px 12px; border-radius: 40px; border: 1px solid var(--secondary-color); align-items: center; }
        .select-group select { background: transparent; border: none; color: var(--select-text); font-weight: bold; font-size: 0.85rem; outline: none; cursor: pointer; font-family: inherit; }
        .select-group select option { background: var(--select-option-bg); color: var(--select-text); }
        .select-group span { color: var(--text-light); font-weight: bold; font-size: 0.85rem; }
        .slider-group { display: flex; align-items: center; gap: 8px; background: var(--btn-bg); padding: 4px 12px; border-radius: 40px; border: 1px solid var(--btn-border); color: var(--text-light); }
        .slider-group input { width: 120px; cursor: pointer; background: #333; }
        .slider-group .speed-value { background: #000000aa; padding: 2px 8px; border-radius: 20px; font-size: 0.7rem; font-weight: bold; color: var(--secondary-color); }
        .mode-switch, .key-switch { background: var(--btn-bg); border: 1px solid var(--secondary-color); cursor: pointer; }
        .three-words { display: flex; justify-content: space-between; align-items: center; gap: 2vw; margin-bottom: 3vh; background: var(--card-bg); border-radius: 48px; padding: 1rem 2rem; backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.2); position: relative; }
        .word-slot { flex: 1; text-align: center; background: rgba(0,0,0,0.3); border-radius: 32px; padding: 12px 8px; transition: 0.2s; }
        .word-slot .label { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 6px; letter-spacing: 1px; }
        .word-slot .word-content { font-size: 1.4rem; font-weight: 800; color: var(--text-light); word-break: break-word; white-space: normal; }
        .word-slot.current { background: var(--primary-color); box-shadow: 0 0 20px var(--primary-color); transform: scale(1.02); }
        .word-slot.current .word-content { color: white; text-shadow: 0 0 5px white; }
        .lang-toggle { position: absolute; right: 20px; top: 50%; transform: translateY(-50%); background: var(--primary-color); border: none; border-radius: 40px; padding: 6px 16px; font-size: 0.75rem; font-weight: bold; color: white; cursor: pointer; box-shadow: 0 0 8px var(--primary-color); font-family: inherit; }
        .flow-area { flex: 1; display: flex; align-items: center; justify-content: center; position: relative; margin: 1rem 0; }
        .word-stage { width: 100%; max-width: 600px; min-height: 160px; position: relative; display: flex; align-items: center; justify-content: center; background: var(--card-bg); border-radius: 60px; backdrop-filter: blur(12px); border: 1px solid var(--secondary-color); box-shadow: var(--card-shadow); overflow: auto; padding: 20px; }
        .floating-word { font-family: 'Nunito', monospace; font-weight: 900; font-size: clamp(1.2rem, 8vw, 3.5rem); color: var(--text-light); text-shadow: var(--neon-glow-secondary); text-align: center; word-break: break-word; white-space: normal; max-width: 100%; line-height: 1.3; transition: opacity 0.2s; opacity: 1; }
        .floating-word.animate-in { animation: fadeInScale 0.35s cubic-bezier(0.2,0.9,0.4,1.1) forwards; }
        .floating-word.animate-out { animation: fadeOutScale 0.35s cubic-bezier(0.2,0.9,0.4,1.1) forwards; }
        @keyframes fadeInScale { 0% { opacity: 0; transform: scale(0.9); } 100% { opacity: 1; transform: scale(1); } }
        @keyframes fadeOutScale { 0% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(0.9); } }
        .right-panel { width: 260px; margin-left: 2vw; }
        .mic-panel { background: rgba(0,0,0,0.55); border-radius: 32px; padding: 16px 10px; text-align: center; backdrop-filter: blur(12px); border: 1px solid var(--secondary-color); width: 100%; }
        .volume-container { position: relative; width: 100%; height: 12px; background: var(--volume-bg); border-radius: 8px; overflow: visible; margin: 12px 0; }
        .live-volume-fill { width: 0%; height: 100%; background: linear-gradient(90deg, var(--primary-color), var(--secondary-color)); border-radius: 8px; transition: width 0.08s linear; position: relative; z-index: 2; }
        .full-marker { position: absolute; top: -4px; width: 3px; height: 20px; background-color: #ffffff; box-shadow: 0 0 8px #00ffff; border-radius: 2px; z-index: 5; transform: translateX(-50%); }
        .full-label { position: absolute; top: -18px; font-size: 10px; color: #aaffff; white-space: nowrap; transform: translateX(-50%); font-weight: bold; text-shadow: 0 0 3px black; }
        .score-badge { font-size: 1.2rem; font-weight: 900; margin-top: 6px; }
        .progress-text { font-size: 0.85rem; margin-top: 10px; background: rgba(0,0,0,0.5); border-radius: 32px; padding: 6px 12px; }
        .word-score-temp { margin-top: 8px; font-size: 0.9rem; font-weight: bold; color: var(--secondary-color); background: rgba(0,0,0,0.4); border-radius: 20px; padding: 4px; }
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(12px); display: flex; align-items: center; justify-content: center; z-index: 1000; opacity: 0; visibility: hidden; transition: 0.2s; }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .modal-card { background: rgba(10,10,25,0.96); border: 1px solid var(--primary-color); border-radius: 32px; max-width: 90vw; width: 550px; padding: 24px; box-shadow: 0 0 40px rgba(0,0,0,0.6); }

        .word-item { display: flex; gap: 12px; padding: 8px; border-bottom: 1px solid rgba(255,255,255,0.1); align-items: center; }
        .theme-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 12px; margin-top: 15px; }
        .theme-card { background: #1e1e2e; border-radius: 24px; padding: 12px; text-align: center; cursor: pointer; border: 1px solid transparent; color: white; }
        .theme-card.active { border-color: var(--primary-color); background: #2a2a3e; }
        input, select { background: #151525; border: 1px solid var(--secondary-color); border-radius: 32px; padding: 8px 14px; color: white; font-family: inherit; }
        .row-flex { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin: 15px 0; }
    </style>
</head>

<div class="app-container">

    </div>
</div>

            return { fullLine: 85, thresholds: [{min:85,score:100},{min:75,score:90},{min:65,score:80},{min:55,score:70},{min:45,score:60}], stabilityPenalty: 0.20 };
        }

    function computeScoreWithStability(avgVolume, volumesArray) {
        const cfg = getScoreConfig();
        let baseScore = 0;
        for(let t of cfg.thresholds) { if(avgVolume >= t.min) { baseScore = t.score; break; } }
        if(baseScore === 0) return 0;
        let stabilityBonus = 1.0;
        if(volumesArray && volumesArray.length > 5) {
            const mean = avgVolume;
            const variance = volumesArray.reduce((sum, v) => sum + Math.pow(v - mean, 2), 0) / volumesArray.length;
            const stdDev = Math.sqrt(variance);
            let penalty = Math.min(cfg.stabilityPenalty, (stdDev - 8) / 40);
            if(penalty > 0) stabilityBonus = Math.max(0.75, 1 - penalty);
        }
        return Math.max(0, Math.floor(baseScore * stabilityBonus));
    }

    async function initMicAndMonitor() {
        if(mediaStream) return true;
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaStream = stream;
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            analyserNode = audioContext.createAnalyser();
            analyserNode.fftSize = 256;
            const source = audioContext.createMediaStreamSource(stream);
            source.connect(analyserNode);
            if(audioContext.state === 'suspended') await audioContext.resume();
            isMicActive = true;
            const bufferLength = analyserNode.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);
            function updateVolumeMeter() {
                if(!analyserNode || !isMicActive) return;
                analyserNode.getByteTimeDomainData(dataArray);
                let maxSample = 0;
                for(let i=0;i<bufferLength;i++) { let v = (dataArray[i] - 128) / 128; maxSample = Math.max(maxSample, Math.abs(v)); }
                let volume = Math.min(100, Math.floor(maxSample * 160));
                volumeFill.style.width = volume + '%';
                liveVolumeValue.innerText = volume + '%';
                if(isPlaying && currentWordIndex < currentWordBank.length) currentWordVolumes.push(volume);
                animationId = requestAnimationFrame(updateVolumeMeter);
            }
            updateVolumeMeter();
            return true;
        } catch(e) { console.warn(e); return false; }
    }

        gradeSelect.innerHTML = '';
        grades.forEach(g => { let opt = document.createElement('option'); opt.value=g; opt.text=g; gradeSelect.appendChild(opt); });
        gradeSelect.value = currentGrade;
        updateUnitSelect();
        gradeSelect.addEventListener('change', () => { if(isPlaying) stopGameAndMic(); currentGrade = gradeSelect.value; updateUnitSelect(); loadUnitAndReset(); });
        unitSelectDom.addEventListener('change', () => { if(isPlaying) stopGameAndMic(); currentUnit = unitSelectDom.value; loadUnitAndReset(); });
    }
    function updateUnitSelect() {
        const units = Object.keys(FULL_WORD_DATA[currentGrade]);
        unitSelectDom.innerHTML = '';
        units.forEach(u => { let opt = document.createElement('option'); opt.value=u; opt.text=`📌 ${u.toUpperCase()}`; unitSelectDom.appendChild(opt); });
        currentUnit = units[0];
        unitSelectDom.value = currentUnit;
    }
    function loadUnitAndReset() {
        if(isPlaying) stopGameAndMic();
        currentFullWordList = buildFullWordList(currentGrade, currentUnit);
        currentWordBank = filterWordsByMode(currentFullWordList);
        currentWordIndex = 0; currentRepeat = 0; wordScores = new Array(currentWordBank.length).fill(0); currentWordVolumes = [];
        updateStatsUI(); stopAnimations(); renderWordListManage();
        volumeFill.style.width = '0%'; liveVolumeValue.innerText = '0%';
        currentWordScoreDisplay.innerText = '🏅 单词得分: --';
        if(currentWordBank.length === 0) alert('当前单元无匹配单词，请关闭重点词模式或选择其他单元');
    }
    
    // 主题系统
    const themes = [{id:'',name:'霓虹粉紫'},{id:'violet',name:'幻影紫'},{id:'forest',name:'荧光绿'},{id:'ocean',name:'深海蓝'},{id:'sunset',name:'日落橙'},{id:'pink',name:'甜心粉'},{id:'simple-light',name:'✨ 简约白'}];
    function initThemeModal(){ themeGrid.innerHTML=''; themes.forEach(t=>{ let card=document.createElement('div'); card.className='theme-card'; card.innerText=t.name; card.onclick=()=>{ if(t.id) document.documentElement.dataset.theme=t.id; else delete document.documentElement.dataset.theme; localStorage.setItem('shoutKing_theme',t.id); themeModalOverlay.classList.remove('active'); }; themeGrid.appendChild(card); }); }
    themeBtn.onclick=()=>themeModalOverlay.classList.add('active');
    themeModalClose.onclick=()=>themeModalOverlay.classList.remove('active');
    initThemeModal(); const savedTheme=localStorage.getItem('shoutKing_theme'); if(savedTheme) document.documentElement.dataset.theme=savedTheme;
    
    function updateSpeed() { let val = parseInt(speedSlider.value); wordDuration = val; speedValueSpan.innerText = val + "ms"; localStorage.setItem('wordDuration', val); }
    speedSlider.addEventListener('input', updateSpeed);
    function updateRepeat() { let val = parseInt(repeatSlider.value); repeatTimes = val; repeatValueSpan.innerText = val + "次"; localStorage.setItem('repeatTimes', val); if(!isPlaying) { currentRepeat = 0; updateStatsUI(); } }
    repeatSlider.addEventListener('input', updateRepeat);
    function updateFontSize() { let val = sizeSlider.value; document.documentElement.style.setProperty('--dynamic-font-size', `${val}cqw`); localStorage.setItem('fontSize', val); }
    sizeSlider.addEventListener('input', updateFontSize);
    soundToggleBtn.onclick = () => { isSoundOn = !isSoundOn; soundToggleBtn.innerText = isSoundOn ? "🔊 音效开" : "🔇 音效关"; };
    manageBtn.onclick = () => { renderWordListManage(); modalOverlay.classList.add('active'); };
    modalClose.onclick = () => modalOverlay.classList.remove('active');
    addWordBtn.onclick = () => { let en = wordEnInput.value.trim(); let zh = wordZhInput.value.trim() || en; if(en){ currentWordBank.push({en,zh}); wordScores.push(0); renderWordListManage(); updateStatsUI(); wordEnInput.value=''; wordZhInput.value=''; } };
    resetBtn.onclick = resetProgress;
    fullscreenBtn.onclick = () => { if(!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen(); };
    startBtn.onclick = startGame;
    resultOkBtn.onclick = () => { resultModal.classList.remove('active'); if(!isPlaying) startBtn.innerText="🎙️ 开始喊麦"; };
    const modeToggleBtn = document.getElementById('modeToggleBtn');
    modeToggleBtn.addEventListener('click', toggleMode);
    keyWordToggleBtn.addEventListener('click', toggleKeyWords);
    langToggleBtn.addEventListener('click', () => { showChineseInThreeWords = !showChineseInThreeWords; updateThreeWords(); });
    
    const savedSpeed = localStorage.getItem('wordDuration'); if(savedSpeed) { wordDuration = parseInt(savedSpeed); speedSlider.value = wordDuration; speedValueSpan.innerText = wordDuration + "ms"; }
    const savedRepeat = localStorage.getItem('repeatTimes'); if(savedRepeat) { repeatTimes = parseInt(savedRepeat); repeatSlider.value = repeatTimes; repeatValueSpan.innerText = repeatTimes + "次"; }
    const savedFont = localStorage.getItem('fontSize'); if(savedFont) { sizeSlider.value = savedFont; document.documentElement.style.setProperty('--dynamic-font-size', `${savedFont}cqw`); }
    
    updateModeUI();
    populateGrades();
    loadUnitAndReset();
    window.addEventListener('beforeunload',()=>{ if(mediaStream) mediaStream.getTracks().forEach(t=>t.stop()); if(audioContext) audioContext.close(); });
</script>
</body>
</html>
