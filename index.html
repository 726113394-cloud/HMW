<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>🎤 单词喊麦王 · 全年级词库</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        :root {
            /* 基础变量 (极光主题) */
            --bg-primary: #0b0f19;
            --bg-secondary: #141b2b;
            --bg-card: rgba(20, 27, 43, 0.6);
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --accent-1: #38bdf8;
            --accent-2: #818cf8;
            --accent-3: #c084fc;
            --border-color: rgba(255, 255, 255, 0.08);
            --shadow-color: rgba(56, 189, 248, 0.15);
            --volume-gradient: linear-gradient(90deg, var(--accent-1), var(--accent-3));
        }
        /* 主题变体 */
        [data-theme="violet"] {
            --accent-1: #b026ff;
            --accent-2: #7c3aed;
            --accent-3: #a78bfa;
            --shadow-color: rgba(176, 38, 255, 0.2);
        }
        [data-theme="forest"] {
            --accent-1: #00ff88;
            --accent-2: #34d399;
            --accent-3: #6ee7b7;
            --shadow-color: rgba(0, 255, 136, 0.2);
        }
        [data-theme="ocean"] {
            --accent-1: #1e88e5;
            --accent-2: #42a5f5;
            --accent-3: #90caf9;
            --shadow-color: rgba(30, 136, 229, 0.2);
        }
        [data-theme="sunset"] {
            --accent-1: #ff884d;
            --accent-2: #ffa726;
            --accent-3: #ffcc80;
            --shadow-color: rgba(255, 136, 77, 0.2);
        }
        [data-theme="pink"] {
            --accent-1: #ff66b5;
            --accent-2: #f472b6;
            --accent-3: #f9a8d4;
            --shadow-color: rgba(255, 102, 181, 0.2);
        }
        [data-theme="neon-blue"] {
            --accent-1: #00d4ff;
            --accent-2: #0099ff;
            --accent-3: #66e5ff;
            --shadow-color: rgba(0, 212, 255, 0.35);
            --bg-primary: #0a0e1a;
        }
        [data-theme="neon-green"] {
            --accent-1: #00ff66;
            --accent-2: #33cc88;
            --accent-3: #88ffbb;
            --shadow-color: rgba(0, 255, 102, 0.35);
            --bg-primary: #0a1a0e;
        }
        [data-theme="neon-orange"] {
            --accent-1: #ff6600;
            --accent-2: #ff9933;
            --accent-3: #ffbb66;
            --shadow-color: rgba(255, 102, 0, 0.35);
            --bg-primary: #1a0e0a;
        }
        [data-theme="neon-pink"] {
            --accent-1: #ff0088;
            --accent-2: #ff44aa;
            --accent-3: #ff88cc;
            --shadow-color: rgba(255, 0, 136, 0.35);
            --bg-primary: #1a0a14;
        }
        [data-theme="simple-light"] {
            --bg-primary: #f5f7fc;
            --bg-secondary: #e9ecf2;
            --bg-card: rgba(255, 255, 255, 0.7);
            --text-primary: #1e293b;
            --text-secondary: #475569;
            --accent-1: #3b82f6;
            --accent-2: #2563eb;
            --accent-3: #60a5fa;
            --border-color: rgba(0, 0, 0, 0.08);
            --shadow-color: rgba(59, 130, 246, 0.15);
        }

        body {
            background: var(--bg-primary);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            color: var(--text-primary);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            transition: background 0.3s, color 0.3s;
        }
        .app-container {
            width: 100%;
            max-width: 1440px;
            height: 95vh;
            max-height: 900px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding: 20px 24px;
            background: var(--bg-card);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: 28px;
            border: 1px solid var(--border-color);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .top-bar {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
        }
        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--accent-1), var(--accent-3));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }
        .btn, .select-group select, .slider-group input {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            border-radius: 40px;
            color: var(--text-primary);
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(4px);
            font-family: inherit;
            outline: none;
        }
        .btn:hover, .select-group select:hover {
            background: rgba(255, 255, 255, 0.12);
            transform: translateY(-1px);
            box-shadow: 0 8px 16px -6px var(--shadow-color);
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
            border-color: transparent;
            color: #0b0f19;
            box-shadow: 0 4px 12px var(--shadow-color);
        }
        .btn-primary:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 8px 24px var(--shadow-color);
        }
        .select-group {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.05);
            padding: 4px 12px 4px 16px;
            border-radius: 40px;
            border: 1px solid var(--border-color);
        }
        .select-group span { color: var(--text-secondary); font-size: 0.75rem; font-weight: 600; }
        .select-group select { background: transparent; border: none; padding: 6px 4px; color: var(--text-primary); font-weight: 600; }
        .slider-group {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.05);
            padding: 4px 14px;
            border-radius: 40px;
            border: 1px solid var(--border-color);
        }
        .slider-group input[type="range"] {
            width: 80px;
            height: 4px;
            -webkit-appearance: none;
            appearance: none;
            background: var(--border-color);
            border-radius: 2px;
            padding: 0;
            border: none;
            outline: none;
            cursor: pointer;
        }
        .slider-group input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--accent-1);
            cursor: pointer;
            box-shadow: 0 0 8px var(--shadow-color);
        }
        .slider-group input[type="range"]::-moz-range-thumb {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--accent-1);
            cursor: pointer;
            border: none;
        }
        .slider-group .value {
            min-width: 32px;
            text-align: center;
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--accent-2);
        }

        .three-words {
            display: flex;
            justify-content: space-between;
            align-items: stretch;
            gap: 16px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 20px;
            padding: 8px 16px;
            border: 1px solid var(--border-color);
            position: relative;
        }
        .word-slot {
            flex: 1;
            text-align: center;
            padding: 8px 4px;
            border-radius: 16px;
            transition: all 0.3s ease;
            background: transparent;
        }
        .word-slot .label { font-size: 0.6rem; text-transform: uppercase; color: var(--text-secondary); letter-spacing: 1px; }
        .word-slot .word-content { font-size: 1.1rem; font-weight: 700; transition: all 0.3s ease; }
        .word-slot.current { background: rgba(56, 189, 248, 0.15); border: 1px solid var(--accent-1); box-shadow: 0 0 20px -8px var(--accent-1); }
        .word-slot.current .word-content { color: var(--accent-1); }
        .lang-toggle {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--border-color);
            border-radius: 40px;
            padding: 4px 12px;
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .lang-toggle:hover { background: rgba(255, 255, 255, 0.15); color: var(--text-primary); }

        .main-stage {
            display: flex;
            gap: 24px;
            flex: 1;
            min-height: 0;
        }
        .flow-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 24px;
            border: 1px solid var(--border-color);
            position: relative;
            overflow: hidden;
        }
        .flow-area::before {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 40%, var(--accent-1), transparent 60%);
            opacity: 0.06;
            animation: pulseGlow 6s ease-in-out infinite alternate;
            pointer-events: none;
        }
        @keyframes pulseGlow {
            0% { transform: translate(-10%, -10%) scale(1); opacity: 0.04; }
            100% { transform: translate(10%, 10%) scale(1.2); opacity: 0.1; }
        }
        .word-stage {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 600px;
        }
        .floating-word {
            font-size: var(--dynamic-font-size, clamp(2rem, 8vw, 4.5rem));
            font-weight: 900;
            color: var(--text-primary);
            text-shadow: 0 0 30px var(--shadow-color);
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s ease;
            transform-style: preserve-3d;
            backface-visibility: hidden;
            word-break: break-word;
            text-align: center;
            padding: 20px;
        }
        .floating-word.flip {
            animation: flipIn 0.5s cubic-bezier(0.23, 1, 0.32, 1) forwards;
        }
        @keyframes flipIn {
            0% { transform: rotateY(90deg) scale(0.8); opacity: 0; }
            100% { transform: rotateY(0deg) scale(1); opacity: 1; }
        }

        .right-panel {
            width: 260px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .mic-panel {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 24px;
            padding: 20px 16px;
            border: 1px solid var(--border-color);
            text-align: center;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .mic-panel .title { font-size: 0.8rem; color: var(--text-secondary); margin-bottom: 12px; }
        .volume-container {
            position: relative;
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 4px;
            overflow: visible;
            margin: 12px 0;
        }
        .live-volume-fill {
            width: 0%;
            height: 100%;
            background: var(--volume-gradient);
            border-radius: 4px;
            transition: width 0.08s linear;
            box-shadow: 0 0 12px var(--accent-1);
        }
        .full-marker {
            position: absolute;
            top: -4px;
            width: 3px;
            height: 16px;
            background: #ffffff;
            border-radius: 2px;
            box-shadow: 0 0 8px #ffffff;
            transform: translateX(-50%);
            z-index: 2;
        }
        .full-label {
            position: absolute;
            top: -18px;
            font-size: 9px;
            color: var(--text-secondary);
            transform: translateX(-50%);
            white-space: nowrap;
            font-weight: 600;
        }
        .score-badge { font-size: 1.8rem; font-weight: 800; color: var(--accent-1); margin-top: 4px; }
        .word-score-temp { font-size: 0.8rem; color: var(--text-secondary); margin-top: 8px; background: rgba(0,0,0,0.2); padding: 6px 12px; border-radius: 40px; }
        .progress-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 16px;
            text-align: center;
        }
        .progress-grid .item { background: rgba(255, 255, 255, 0.04); padding: 8px; border-radius: 12px; }
        .progress-grid .item span { display: block; font-size: 0.65rem; color: var(--text-secondary); }
        .progress-grid .item strong { font-size: 1rem; color: var(--text-primary); }

        /* 新增控制按钮组 */
        .game-controls {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-top: 12px;
        }
        .game-controls .btn {
            flex: 1;
            padding: 6px 12px;
            font-size: 0.75rem;
            background: rgba(255,255,255,0.08);
        }
        .game-controls .btn-primary {
            background: var(--accent-1);
            color: #0b0f19;
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .modal-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 32px;
            max-width: 90vw;
            width: 550px;
            max-height: 80vh;
            padding: 24px;
            overflow-y: auto;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .modal-card h3 { margin-bottom: 16px; color: var(--text-primary); }
        .word-list { max-height: 240px; overflow-y: auto; margin-bottom: 16px; }
        .word-item { display: flex; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--border-color); align-items: center; }
        .word-item .del-btn { background: none; border: none; color: #f87171; cursor: pointer; font-size: 1rem; padding: 0 8px; }
        .row-flex { display: flex; gap: 12px; flex-wrap: wrap; margin: 12px 0; }
        .row-flex input { flex: 1; padding: 10px 16px; border-radius: 40px; border: 1px solid var(--border-color); background: rgba(0,0,0,0.3); color: var(--text-primary); outline: none; }
        .theme-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 16px 0; }
        .theme-card {
            background: rgba(255, 255, 255, 0.05);
            padding: 12px;
            border-radius: 16px;
            text-align: center;
            cursor: pointer;
            border: 1px solid transparent;
            transition: all 0.3s ease;
            color: var(--text-primary);
        }
        .theme-card:hover { border-color: var(--accent-1); background: rgba(255, 255, 255, 0.08); }
        .theme-card.active { border-color: var(--accent-1); background: rgba(255, 255, 255, 0.12); }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 4px; }

        @media (max-width: 900px) {
            .app-container { height: 98vh; padding: 16px; }
            .main-stage { flex-direction: column; }
            .right-panel { width: 100%; flex-direction: row; flex-wrap: wrap; }
            .right-panel .mic-panel { flex: 1; min-width: 180px; }
            .controls { gap: 6px; }
            .slider-group input[type="range"] { width: 60px; }
            .three-words { flex-wrap: nowrap; overflow-x: auto; }
            .word-slot { min-width: 80px; }
        }
        @media (max-width: 600px) {
            .top-bar { flex-direction: column; align-items: stretch; }
            .controls { justify-content: center; }
            .floating-word { font-size: var(--dynamic-font-size, clamp(1.5rem, 10vw, 3rem)); }
        }
    </style>
</head>
<body>
<div class="app-container">
    <!-- 顶部栏 -->
    <div class="top-bar">
        <div class="logo">🎤 单词喊麦王 · 全年级</div>
        <div class="controls">
            <div class="select-group"><span>📖</span><select id="gradeSelect"></select></div>
            <div class="select-group"><span>📚</span><select id="unitSelect"></select></div>
            <div class="slider-group"><span>🐇</span><input type="range" id="speedSlider" min="400" max="1600" step="10" value="900"><span>🐢</span><span class="value" id="speedValue">900</span></div>
            <div class="slider-group"><span>🔁</span><input type="range" id="repeatSlider" min="1" max="8" step="1" value="4"><span class="value" id="repeatValue">4</span></div>
            <div class="slider-group"><span>A</span><input type="range" id="sizeSlider" min="12" max="72" step="1" value="36"><span>A+</span></div>
            <div class="slider-group"><span>⚡难度</span><input type="range" id="difficultySlider" min="0" max="100" step="1" value="40"><span class="value" id="difficultyValue">40</span></div>
            <button class="btn" id="soundToggleBtn">🔊 音效</button>
            <button class="btn" id="modeToggleBtn">👤 单人</button>
            <button class="btn" id="keyWordToggleBtn">⭐ 重点词</button>
            <button class="btn btn-primary" id="startGameBtn">🎙️ 开始</button>
            <button class="btn" id="resetGameBtn">🔄 重置</button>
            <button class="btn" id="themeBtn">🎨 主题</button>
            <button class="btn" id="manageBtn">📘 词表</button>
        </div>
    </div>

    <!-- 三词预览 -->
    <div class="three-words" id="threeWordsArea">
        <div class="word-slot" id="prevSlot"><div class="label">⬅ 上一个</div><div class="word-content" id="prevWord">---</div></div>
        <div class="word-slot current" id="currentSlot"><div class="label">🎤 当前</div><div class="word-content" id="currentWordZh">---</div></div>
        <div class="word-slot" id="nextSlot"><div class="label">➡ 下一个</div><div class="word-content" id="nextWord">---</div></div>
        <button class="lang-toggle" id="langToggleBtn">🌐 中/EN</button>
    </div>

    <!-- 主舞台 -->
    <div class="main-stage">
        <div class="flow-area"><div class="word-stage" id="wordStage"><div class="floating-word" id="floatingWord">准备就绪</div></div></div>
        <div class="right-panel">
            <div class="mic-panel">
                <div class="title">🎙️ 实时音量</div>
                <div class="volume-container"><div class="live-volume-fill" id="volumeFill"></div><div class="full-marker" id="fullMarker"></div><div class="full-label" id="fullLabel">⭐ 满分线</div></div>
                <div class="score-badge" id="liveVolumeValue">0%</div>
                <div class="word-score-temp" id="currentWordScoreDisplay">🏅 单词得分: --</div>
                <div class="progress-grid">
                    <div class="item"><span>📖 单词</span><strong id="wordCounter">0 / 0</strong></div>
                    <div class="item"><span>🔁 重复</span><strong id="repeatCounter">0/0</strong></div>
                    <div class="item"><span>⭐ 总分</span><strong id="totalScoreSpan">0</strong></div>
                    <div class="item"><span>💯 平均</span><strong id="avgScoreSpan">0.0</strong></div>
                </div>
                <!-- 新增控制按钮 -->
                <div class="game-controls">
                    <button class="btn btn-primary" id="pauseBtn">⏸️ 暂停</button>
                    <button class="btn btn-primary" id="resumeBtn" style="display:none;">▶️ 继续</button>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 模态框 -->
<div class="modal-overlay" id="modalOverlay"><div class="modal-card"><h3>📘 单词表 (当前单元)</h3><div class="word-list" id="wordList"></div><div class="row-flex"><input type="text" id="wordEn" placeholder="英文"><input type="text" id="wordZh" placeholder="中文"><button class="btn" id="addWordBtn">➕ 添加</button></div><button class="btn" id="modalClose">关闭</button></div></div>
<div class="modal-overlay" id="resultModal"><div class="modal-card"><h2 id="resultTitle">🎤 单元评分</h2><p id="resultMsg"></p><button class="btn btn-primary" id="resultOkBtn">继续挑战</button></div></div>
<div class="modal-overlay" id="themeModalOverlay"><div class="modal-card"><h3>🎨 炫彩主题</h3><div class="theme-grid" id="themeGrid"></div><button class="btn" id="themeModalClose">关闭</button></div></div>

<script>
    // ================================================================
    //  1. 完整词库 (PEP 三~六年级，补齐四/五/六年级上册)
    // ================================================================
    const FULL_WORD_DATA = {
        "三年级上册": {
            unit1: [
                { en: "name", zh: "名字", isBold: false },{ en: "nice", zh: "美好的", isBold: false },{ en: "ear", zh: "耳朵", isBold: true },{ en: "hand", zh: "手", isBold: true },{ en: "eye", zh: "眼睛", isBold: true },{ en: "mouth", zh: "嘴巴", isBold: true },{ en: "arm", zh: "手臂", isBold: true },{ en: "can", zh: "能；可以", isBold: false },{ en: "share", zh: "分享", isBold: true },{ en: "smile", zh: "微笑", isBold: true },{ en: "listen", zh: "听", isBold: true },{ en: "help", zh: "帮助", isBold: true },{ en: "say", zh: "说", isBold: false },{ en: "friend", zh: "朋友", isBold: false },{ en: "good", zh: "好的", isBold: false }

    // ================================================================
    //  4. 评分与难度配置（基于滑块连续值 0-100）
    // ================================================================
    function getScoreConfig() {
        // 将难度值映射到满分线 70% ~ 95%
        const fullLine = 70 + (difficultyValue / 100) * 25; // 70~95
        // 阈值线性映射：基于满分线生成5个梯级，间隔约 10~12 分
        const step = Math.min(12, Math.max(8, 10 - difficultyValue / 50)); // 难度越高阈值越密
        const thresholds = [];
        for (let i = 0; i < 5; i++) {
            const min = Math.max(20, fullLine - (4 - i) * step);
            const score = 100 - (4 - i) * 10;
            thresholds.push({ min, score });
        }
        // 确保第一个阈值分数为100，且min为fullLine
        thresholds[0].min = fullLine;
        thresholds[0].score = 100;
        // 稳定性惩罚因子：难度越高惩罚越大
        const stabilityPenalty = 0.1 + (difficultyValue / 100) * 0.2; // 0.1~0.3
        return { fullLine, thresholds, stabilityPenalty };
    }
    function computeScoreWithStability(avgVolume, volumes) {
        const cfg = getScoreConfig();
        let baseScore = 0;
        for (let t of cfg.thresholds) { if (avgVolume >= t.min) { baseScore = t.score; break; } }
        if (baseScore === 0) return 0;
        let stabilityBonus = 1.0;
        if (volumes && volumes.length > 5) {
            const mean = avgVolume;
            const variance = volumes.reduce((s, v) => s + Math.pow(v - mean, 2), 0) / volumes.length;
            const stdDev = Math.sqrt(variance);
            let penalty = Math.min(cfg.stabilityPenalty, (stdDev - 8) / 40);
            if (penalty > 0) stabilityBonus = Math.max(0.75, 1 - penalty);
        }
        return Math.max(0, Math.floor(baseScore * stabilityBonus));
    }

    function playBeatSound() {
        if (!isSoundOn) return;
        try {
            if (!beatAudioCtx) beatAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (beatAudioCtx.state === 'suspended') beatAudioCtx.resume();
            const osc = beatAudioCtx.createOscillator();
            const gain = beatAudioCtx.createGain();
            osc.connect(gain); gain.connect(beatAudioCtx.destination);
            osc.type = 'sine'; osc.frequency.value = 420;
            gain.gain.setValueAtTime(0.3, beatAudioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, beatAudioCtx.currentTime + 0.2);
            osc.start(); osc.stop(beatAudioCtx.currentTime + 0.2);
        } catch (e) {}
    }

    function finishCurrentWord() {
        if (currentWordVolumes.length === 0) {
            wordScores[currentWordIndex] = 0;
            currentWordScoreDisplay.textContent = '🏅 得分: 0 (无声)';
        } else {
            const avg = currentWordVolumes.reduce((a, b) => a + b, 0) / currentWordVolumes.length;
            const score = computeScoreWithStability(avg, currentWordVolumes);
            wordScores[currentWordIndex] = score;
            let msg = `🏅 得分: ${score} (平均 ${Math.floor(avg)}%)`;
            if (currentWordVolumes.length > 5) {
                const variance = currentWordVolumes.reduce((s, v) => s + Math.pow(v - avg, 2), 0) / currentWordVolumes.length;
                const stdDev = Math.sqrt(variance);
                if (stdDev > 12) msg += ` 不稳 -${Math.floor((stdDev - 8) / 40 * 100)}%`;
            }
            currentWordScoreDisplay.textContent = msg;
        }
        setTimeout(() => { if (isPlaying) currentWordScoreDisplay.textContent = '🏅 单词得分: --'; }, 1800);
        updateStatsUI();
        currentWordVolumes = [];
    }

            showNextWord();
        }, wordDuration);

    async function initMicAndMonitor() {
        if (mediaStream) return true;
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaStream = stream;
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            analyserNode = audioContext.createAnalyser();
            analyserNode.fftSize = 256;
            const source = audioContext.createMediaStreamSource(stream);
            source.connect(analyserNode);
            if (audioContext.state === 'suspended') await audioContext.resume();
            isMicActive = true;
            const bufferLength = analyserNode.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);
            function updateVolume() {
                if (!analyserNode || !isMicActive) return;
                analyserNode.getByteTimeDomainData(dataArray);
                let max = 0;
                for (let i = 0; i < bufferLength; i++) {
                    const v = (dataArray[i] - 128) / 128;
                    if (Math.abs(v) > max) max = Math.abs(v);
                }
                const vol = Math.min(100, Math.floor(max * 160));
                volumeFill.style.width = vol + '%';
                liveVolumeValue.textContent = vol + '%';
                if (isPlaying && !isPaused && currentWordIndex < currentWordBank.length) currentWordVolumes.push(vol);
                animationId = requestAnimationFrame(updateVolume);
            }
            updateVolume();
            return true;
        } catch (e) { console.warn(e); return false; }
    }

    // ================================================================
    //  6. 词表管理 & UI 渲染
    // ================================================================
    function renderWordList() {
        wordListDiv.innerHTML = '';
        currentWordBank.forEach((w, i) => {
            const div = document.createElement('div');
            div.className = 'word-item';
            div.innerHTML = `<span style="flex:2">${w.en}</span><span style="flex:2">${w.zh}</span><button class="del-btn" data-idx="${i}">🗑️</button>`;
            wordListDiv.appendChild(div);
        });
        document.querySelectorAll('.del-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                const idx = parseInt(this.dataset.idx);
                if (confirm('删除此单词？')) {
                    currentWordBank.splice(idx, 1);
                    wordScores = new Array(currentWordBank.length).fill(0);
                    if (currentWordIndex >= currentWordBank.length) currentWordIndex = Math.max(0, currentWordBank.length - 1);
                    updateStatsUI();
                    renderWordList();
                }
            });
        });
    }

    function loadUnit() {
        if (isPlaying) stopGameAndMic();
        const grade = gradeSelect.value, unit = unitSelectDom.value;
        currentGrade = grade; currentUnit = unit;
        const full = buildFullWordList(grade, unit);
        currentWordBank = filterWordsByMode(full);
        currentWordIndex = 0; currentRepeat = 0;
        wordScores = new Array(currentWordBank.length).fill(0);
        currentWordVolumes = [];
        updateStatsUI();
        renderWordList();
        volumeFill.style.width = '0%'; liveVolumeValue.textContent = '0%';
        currentWordScoreDisplay.textContent = '🏅 单词得分: --';
        floatingWord.textContent = currentWordBank.length ? currentWordBank[0].en : '无单词';
        floatingWord.classList.remove('flip');
        if (!currentWordBank.length) alert('当前单元无匹配单词，请切换或关闭重点词模式');
    }

    function populateGrades() {
        const grades = Object.keys(FULL_WORD_DATA);
        gradeSelect.innerHTML = grades.map(g => `<option value="${g}">${g}</option>`).join('');
        gradeSelect.value = currentGrade;
        updateUnitSelect();
        gradeSelect.addEventListener('change', () => { currentGrade = gradeSelect.value; updateUnitSelect(); loadUnit(); });
        unitSelectDom.addEventListener('change', loadUnit);
    }
    function updateUnitSelect() {
        const units = Object.keys(FULL_WORD_DATA[currentGrade] || {});
        unitSelectDom.innerHTML = units.map(u => `<option value="${u}">📌 ${u.toUpperCase()}</option>`).join('');
        if (units.length) { currentUnit = units[0]; unitSelectDom.value = currentUnit; }
        loadUnit();
    }

    // ================================================================
    //  7. 事件绑定与初始化
    // ================================================================
    // 速度
    speedSlider.addEventListener('input', function() {
        wordDuration = parseInt(this.value);
        speedValue.textContent = wordDuration;
        localStorage.setItem('shoutSpeed', wordDuration);
    });
    // 重复次数
    repeatSlider.addEventListener('input', function() {
        repeatTimes = parseInt(this.value);
        repeatValue.textContent = repeatTimes;
        localStorage.setItem('shoutRepeat', repeatTimes);
        if (!isPlaying) { currentRepeat = 0; updateStatsUI(); }
    });
    // 字体大小 - 范围扩大到 12-72px
    sizeSlider.addEventListener('input', function() {
        const size = parseInt(this.value);
        document.documentElement.style.setProperty('--dynamic-font-size', `${size}px`);
        localStorage.setItem('shoutSize', size);
    });
    // 难度滑块
    difficultySlider.addEventListener('input', function() {
        difficultyValue = parseInt(this.value);
        difficultyValueSpan.textContent = difficultyValue;
        localStorage.setItem('shoutDifficulty', difficultyValue);
        updateModeUI(); // 更新满分线
    });
    // 音效
    soundToggleBtn.addEventListener('click', function() {
        isSoundOn = !isSoundOn;
        this.textContent = isSoundOn ? '🔊 音效' : '🔇 音效';
    });
    // 语言切换
    langToggleBtn.addEventListener('click', function() {
        showChineseInThreeWords = !showChineseInThreeWords;
        updateThreeWords();
    });
    // 主题
    const themeList = [
        { id: '', name: '✨ 极光' },
        { id: 'violet', name: '💜 幻影紫' },
        { id: 'forest', name: '🌿 荧光绿' },
        { id: 'ocean', name: '🌊 深海蓝' },
        { id: 'sunset', name: '🌅 日落橙' },
        { id: 'pink', name: '🌸 甜心粉' },
        { id: 'neon-blue', name: '💎 霓虹蓝' },
        { id: 'neon-green', name: '💚 霓虹绿' },
        { id: 'neon-orange', name: '🧡 霓虹橙' },
        { id: 'neon-pink', name: '💗 霓虹粉' },
        { id: 'simple-light', name: '☀️ 简约白' }
    ];
    function initThemeModal() {
        themeGrid.innerHTML = '';
        const currentTheme = document.documentElement.dataset.theme || '';
        themeList.forEach(t => {
            const card = document.createElement('div');
            card.className = 'theme-card';
            card.textContent = t.name;
            if (t.id === currentTheme) card.classList.add('active');
            card.onclick = () => {
                if (t.id) document.documentElement.setAttribute('data-theme', t.id);
                else document.documentElement.removeAttribute('data-theme');
                localStorage.setItem('shoutTheme', t.id);
                document.querySelectorAll('.theme-card').forEach(c => c.classList.remove('active'));
                card.classList.add('active');
                themeModalOverlay.classList.remove('active');
            };
            themeGrid.appendChild(card);
        });
    }
    themeBtn.onclick = () => { initThemeModal(); themeModalOverlay.classList.add('active'); };
    themeModalClose.onclick = () => themeModalOverlay.classList.remove('active');
    const savedTheme = localStorage.getItem('shoutTheme');
    if (savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);

    // 词表管理
    manageBtn.onclick = () => { renderWordList(); modalOverlay.classList.add('active'); };
    modalClose.onclick = () => modalOverlay.classList.remove('active');
    addWordBtn.onclick = () => {
        const en = wordEnInput.value.trim(), zh = wordZhInput.value.trim() || en;
        if (en) { currentWordBank.push({ en, zh }); wordScores.push(0); renderWordList(); updateStatsUI(); wordEnInput.value = ''; wordZhInput.value = ''; }
    };
    // 结果弹窗
    resultOkBtn.onclick = () => { resultModal.classList.remove('active'); if (!isPlaying) startBtn.textContent = '🎙️ 开始'; resetProgress(); };
    // 重置
    resetBtn.onclick = resetProgress;
    // 开始/停止
    startBtn.onclick = startGame;
    // 暂停/继续
    pauseBtn.addEventListener('click', pauseGame);
    resumeBtn.addEventListener('click', resumeGame);
    // 模式切换
    modeToggleBtn.addEventListener('click', function() { if (isPlaying) { alert('请先停止挑战'); return; } isClassMode = !isClassMode; updateModeUI(); loadUnit(); });
    keyWordToggleBtn.addEventListener('click', function() { if (isPlaying) { alert('请先停止挑战'); return; } onlyKeyWords = !onlyKeyWords; updateModeUI(); loadUnit(); });

    // 恢复本地存储
    const savedSpeed = localStorage.getItem('shoutSpeed');
    if (savedSpeed) { wordDuration = parseInt(savedSpeed); speedSlider.value = wordDuration; speedValue.textContent = wordDuration; }
    const savedRepeat = localStorage.getItem('shoutRepeat');
    if (savedRepeat) { repeatTimes = parseInt(savedRepeat); repeatSlider.value = repeatTimes; repeatValue.textContent = repeatTimes; }
    const savedSize = localStorage.getItem('shoutSize');
    if (savedSize) { sizeSlider.value = savedSize; document.documentElement.style.setProperty('--dynamic-font-size', `${savedSize}px`); }
    const savedDifficulty = localStorage.getItem('shoutDifficulty');
    if (savedDifficulty) { difficultyValue = parseInt(savedDifficulty); difficultySlider.value = difficultyValue; difficultyValueSpan.textContent = difficultyValue; }

    // 初始化
    populateGrades();
    updateModeUI();

    window.addEventListener('beforeunload', () => {
        if (mediaStream) mediaStream.getTracks().forEach(t => t.stop());
        if (audioContext) audioContext.close();
    });
</script>
</body>
</html>
